<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Snake Game</title>
 <style>
 body {
 display: flex;
 justify-content: center;
 align-items: center;
 height: 100vh;
 margin: 0;
 background-color: #333;
 font-family: 'Courier New', Courier, monospace;
 color: #fff;
 }
 canvas {
 border: 2px solid #555;
 background-color: #222;
 display: block;
 }
 #overlay {
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 display: flex;
 justify-content: center;
 align-items: center;
 flex-direction: column;
 justify-content: center;
 color: white;
 font-size: 2.5rem;
 text-align: center;
 opacity: 0;
 pointer-events: none;
 transition: opacity 0.5s ease-in-out;
 z-index: 10;
 }
 #overlay.game-over {
 opacity: 1;
 pointer-events: all;
 }
 #overlay button {
 margin-top: 20px;
 padding: 10px 20px;
 font-size: 1.2rem;
 cursor: pointer;
 border: none;
 border-radius: 5px;
 background-color: #4CAF50;
 color: white;
 transition: background-color 0.3s;
 }
 #overlay button:hover {
 background-color: #45a049;
 }
 </style>
</head>
<body>
 <canvas id="gameCanvas"></canvas>
 <div id="overlay">
 <div>Snake Game</div>
 <button id="restartButton">Restart</button>
 </div>

 <script>
 const canvas = document.getElementById('gameCanvas');
 const ctx = canvas.getContext('2d');
 const overlay = document.getElementById('overlay');

 // Game Settings
 const CELL_SIZE = 20;
 const GRID_WIDTH = 20;
 const GRID_HEIGHT = 20;
 
 canvas.width = CELL_SIZE * GRID_WIDTH;
 canvas.height = CELL_SIZE * GRID_HEIGHT;

 // Game State
 let snake = [
 { x: 10, y: 10 },
 { x: 9, y: 10 },
 { x: 8, y: 10 }
 ];
 let direction = 'right';
 let food = { x: 15, y: 15 };
 let score = 0;
 let gameRunning = true;
 let gameSpeed = 100;

 function getRandomFoodPosition() {
 let newFood;
 do {
 newFood = {
 x: Math.floor(Math.random() * GRID_WIDTH),
 y: Math.floor(Math.random() * GRID_HEIGHT)
 };
 } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
 return newFood;
 }

 function draw() {
 ctx.fillStyle = '#222';
 ctx.fillRect(0, 0, canvas.width, canvas.height);
 ctx.fillStyle = '#4CAF50';
 snake.forEach(segment => {
 ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE - 2, CELL_SIZE - 2);
 });
 ctx.fillStyle = '#f44336';
 ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE - 2, CELL_SIZE - 2);
 ctx.fillStyle = '#fff';
 ctx.font = 'bold 20px monospace';
 ctx.fillText(`Score: ${score}`, 10, 30);
 }
 
 function gameOver() {
 gameRunning = false;
 overlay.classList.add('game-over');
 overlay.innerHTML = `
 <div>Game Over!</div>
 <div>Your Score: ${score}</div>
 <button id="restartButton">Restart</button>
 `;
 }
 
 function resetGame() {
 // Reset all game variables to their initial state
 snake = [
 { x: 10, y: 10 },
 { x: 9, y: 10 },
 { x: 8, y: 10 }
 ];
 direction = 'right';
 food = getRandomFoodPosition();
 score = 0;
 gameRunning = true; // CRITICAL: Ensure the game is running
 gameSpeed = 100;
 
 // Reset the UI
 overlay.classList.remove('game-over');
 overlay.innerHTML = '<div>Snake Game</div><button id="restartButton">Restart</button>';
 
 // Restart the game loop
 playGame();
 }

 function moveSnake() {
 const head = { ...snake };
 switch (direction) {
 case 'up': head.y--; break;
 case 'down': head.y++; break;
 case 'left': head.x--; break;
 case 'right': head.x++; break;
 }
 if (head.x < 0 || head.x >= GRID_WIDTH || head.y < 0 || head.y >= GRID_HEIGHT) {
 gameOver();
 return;
 }
 if (snake.some(segment => segment.x === head.x && segment.y === head.y && segment !== head)) {
 gameOver();
 return;
 }
 snake.unshift(head);
 if (head.x === food.x && head.y === food.y) {
 score++;
 food = getRandomFoodPosition();
 if (score % 5 === 0) {
 gameSpeed = Math.max(50, gameSpeed - 10);
 }
 } else {
 snake.pop();
 }
 }

 function playGame() {
 if (gameRunning) {
 moveSnake();
 draw();
 setTimeout(() => {
 playGame();
 }, gameSpeed);
 }
 }

 // --- Event Listeners ---
 
 // FIX: This single listener now handles clicks on the restart button correctly every time.
 // This is called event delegation and it's a more robust way to handle dynamic content.
 overlay.addEventListener('click', (event) => {
 if (event.target.id === 'restartButton') {
 resetGame();
 }
 });

 document.addEventListener('keydown', event => {
 if (!gameRunning && event.key === 'R') {
 resetGame();
 }
 event.preventDefault();
 switch (event.key) {
 case 'ArrowUp': if (direction !== 'down') direction = 'up'; break;
 case 'ArrowDown': if (direction !== 'up') direction = 'down'; break;
 case 'ArrowLeft': if (direction !== 'right') direction = 'left'; break;
 case 'ArrowRight': if (direction !== 'left') direction = 'right'; break;
 }
 });

 // --- Start Game ---
 document.addEventListener('DOMContentLoaded', () => {
 playGame();
 overlay.innerHTML = '<div>Use Arrow Keys to Play</div><div>Press R to Restart</div>';
 });

 </script>
</body>
</html>
